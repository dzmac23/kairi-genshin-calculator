# Builds the app on every push and pull request, and publishes it to GitHub Pages
# when the push is to main.
#
# One-time setup (repository owner): Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions". Until then the "deploy" job fails; the build still runs.
name: Build and deploy app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Never publish two versions at the same time; a newer push replaces an older one in progress.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    uses: ./.github/workflows/build-gcsim-wasm.yml

  build:
    needs: engine
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Download the gcsim engine
        uses: actions/download-artifact@v8
        with:
          name: gcsim-engine
          path: public/gcsim

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type-check and build
        run: npm run build

      - name: Package for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
